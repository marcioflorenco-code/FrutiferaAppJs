<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CADASTRAMENTO</title>
<!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
<!-- Header navbar -->
  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="./index.html">PARAIBA FRUTIFERA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="./index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="./cadastro.html">Cadastrar Frutifera</a>
            </li>

          </ul>
        </div>
      </div>
    </nav>
  </header>

<!--main-->
  <main class="container">
    <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap mb-3">
        <div>
          <h1 class="h3 mb-1">Cadastre sua frutifera</h1>
          </div>
<!-- Botão de adicionar -->
          <button id="btnOpenModal" class="btn btn-primary btn-lg rounded-circle" title="Cadastrar" data-bs-toggle="modal" data-bs-target="#especieModal">
            +
          </button>
        </div>
      </div>

<!-- Tabela de listagem -->
    <div class="row" id="especiesContainer"></div>

<!-- Modal-->
    <div class="modal fade" id="especieModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">PARAIBA FRUTIFERA</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="especieForm">
            <div class="modal-body">
              
              <div class="mb-3">
                <label for="nomePopular" class="form-label">Nome Popular</label>
                <input type="text" class="form-control" name="nomePopular" id="nomePopular">
              </div>
              <div class="mb-3">
                <label for="nomeCientifico" class="form-label">Nome Científico</label>
                <input type="text" class="form-control" name="nomeCientifico" id="nomeCientifico">
              </div>
              <div class="mb-3">
                <label for="producaoMedia" class="form-label">Produção (Kg)</label>
                <input type="number" class="form-control" name="producaoMedia" id="producaoMedia">
              </div>
              <div class="mb-3">
                <label for="dataPlantio" class="form-label">Data do Plantio</label>
                <input type="date" class="form-control" name="dataPlantio" id="dataPlantio" placeholder="Another input placeholder">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
  <footer></footer>

<!-- JQuery -->
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

<!-- ToastFy -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <script src="./src/cadastro.js" type="module"></script>
</body>

</html>
